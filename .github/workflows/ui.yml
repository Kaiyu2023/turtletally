name: UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate browser draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser check suite
        run: npm run check:ui

      # The repository allows only actions/checkout and actions/setup-node, so
      # failure diagnostics are printed into the log rather than uploaded.
      - name: Print failure diagnostics
        if: failure()
        run: |
          if [ ! -d test-results ]; then
            echo "No Playwright diagnostics were produced."
            exit 0
          fi
          find test-results -type f | sort
          find test-results -name 'error-context.md' -print -exec cat {} \;
