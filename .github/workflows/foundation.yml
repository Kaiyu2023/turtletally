name: Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Terraform
        env:
          TERRAFORM_VERSION: 1.15.9
          TERRAFORM_ZIP_SHA256: 76edd0b22d2f27d3d2e097cd793209646f719cf60f02ff3af626b07361137da1
        run: |
          terraform_zip="$RUNNER_TEMP/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          terraform_checksum="$RUNNER_TEMP/terraform_SHA256SUMS"
          terraform_bin_dir="$RUNNER_TEMP/terraform-bin"
          curl --fail --silent --show-error --location \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output "$terraform_zip"
          printf '%s  %s\n' "$TERRAFORM_ZIP_SHA256" "$terraform_zip" > "$terraform_checksum"
          sha256sum --check "$terraform_checksum"
          mkdir -p "$terraform_bin_dir"
          unzip -q "$terraform_zip" -d "$terraform_bin_dir"
          "$terraform_bin_dir/terraform" version
          printf '%s\n' "$terraform_bin_dir" >> "$GITHUB_PATH"

      - name: Install the ARM64 cross toolchain
        # The TLS stack the AWS SDK uses compiles C, so the cross build needs
        # the target's headers and libraries as well as its linker.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install the pinned Rust security tools
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          tools_dir="$RUNNER_TEMP/rust-tools"
          mkdir -p "$tools_dir"

          audit_archive="$RUNNER_TEMP/cargo-audit.tgz"
          curl --fail --silent --show-error --location \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz" \
            --output "$audit_archive"
          printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$audit_archive" | sha256sum --check
          tar --extract --gzip --file "$audit_archive" --directory "$tools_dir" --strip-components 1 \
            "cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit"

          deny_archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$deny_archive"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$deny_archive" | sha256sum --check
          tar --extract --gzip --file "$deny_archive" --directory "$tools_dir" --strip-components 1 \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"

          chmod +x "$tools_dir/cargo-audit" "$tools_dir/cargo-deny"
          "$tools_dir/cargo-audit" --version
          "$tools_dir/cargo-deny" --version
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Run the foundation check suite
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npm run check:foundation
