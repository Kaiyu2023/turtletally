name: Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Rust security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run local foundation tests
        run: |
          npm run test:node
          npm run test:rust

      - name: Audit dependencies
        run: npm run audit

      - name: Build
        run: npm run build

      - name: Synthesize the empty CDK app
        run: npm run cdk:synth

      - name: Check repository for forbidden files and common secret formats
        run: ./scripts/check-repository-secrets.sh
