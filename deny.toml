[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are unpublished and referenced by path, which has no
# version to pin. The rule still applies to every dependency from a registry.
allow-wildcard-paths = true
highlight = "all"

[licenses]
# BSD-3-Clause, ISC, and Zlib arrive with the TLS stack: constant-time
# comparison, the certificate verifier and its parser, and a hash function.
# CDLA-Permissive-2.0 covers the Mozilla root certificate set, which is data
# rather than code. All are permissive and carry no reciprocal obligation for a
# repository under MIT.
allow = ["Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
