[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are unpublished and referenced by path, which has no
# version to pin. The rule still applies to every dependency from a registry.
allow-wildcard-paths = true
highlight = "all"

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
