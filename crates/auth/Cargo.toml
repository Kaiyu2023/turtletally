[package]
name = "turtle-tally-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc", "now"] }
# The aws-lc-rs backend is already in the tree behind rustls, and it avoids the
# pure-Rust RSA implementation whose timing advisory has no fix.
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10.2"
reqwest = { version = "0.13.1", default-features = false, features = ["form", "http2", "json", "rustls", "webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
turtle-tally-application = { path = "../application" }
turtle-tally-domain = { path = "../domain" }
