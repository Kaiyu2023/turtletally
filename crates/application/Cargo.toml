[package]
name = "turtle-tally-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc", "now"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
turtle-tally-domain = { path = "../domain" }
uuid = { version = "1.19.1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
