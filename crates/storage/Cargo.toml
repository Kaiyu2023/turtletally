[package]
name = "turtle-tally-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aws-config = { version = "1.11.0", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-dynamodb = { version = "1.122.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.143.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc", "now"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
turtle-tally-application = { path = "../application" }
turtle-tally-domain = { path = "../domain" }
