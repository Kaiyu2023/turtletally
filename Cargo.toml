[workspace]
members = ["crates/app-api", "crates/application", "crates/auth", "crates/domain", "crates/mcp-api", "crates/scheduler-worker", "crates/storage"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
